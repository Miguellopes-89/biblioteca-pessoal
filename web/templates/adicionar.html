<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <title>Adicionar Livro — Biblioteca Pessoal</title>
    <style>
        body { font-family: sans-serif; margin: 2rem; max-width: 500px; }
        label { display: block; margin-top: 1rem; font-weight: bold; }
        input, select { width: 100%; padding: 0.4rem; box-sizing: border-box; }
        button { margin-top: 1.5rem; padding: 0.6rem 1.2rem; }
        .erro { color: #b00020; font-weight: bold; }
        a { display: inline-block; margin-top: 1rem; }
    </style>
</head>
<body>
    <h1>Adicionar Livro</h1>

    {% if erro %}
    <p class="erro">{{ erro }}</p>
    {% endif %}

    <form method="POST">
        <label for="titulo">Título:</label>
        <input type="text" id="titulo" name="titulo" required>

        <label for="autores_str">Autores:</label>
        <input type="text" id="autores_str" name="autores_str" placeholder="separados por vírgula, ex.: Fabcaro, Conrad">

        <label for="editora">Editora:</label>
        <input type="text" id="editora" name="editora">

        <label for="colecao">Coleção:</label>
        <input type="text" id="colecao" name="colecao">

        <label for="genero">Género:</label>
        <input type="text" id="genero" name="genero">

        <label for="isbn">ISBN:</label>
        <div style="display: flex; gap: 0.5rem;">
            <input type="text" id="isbn" name="isbn" style="flex: 1;">
            <button type="button" id="btn-procurar" onclick="procurarISBN()">Procurar</button>
        </div>
        <p id="mensagem-isbn" style="margin: 0.3rem 0 0; font-size: 0.9rem;"></p>
        <img id="capa-preview" src="" alt="Capa do livro" style="display: none; max-width: 120px; margin-top: 0.5rem;">

        <label for="estado_leitura">Estado de leitura:</label>
        <select id="estado_leitura" name="estado_leitura">
            <option value="não lido">não lido</option>
            <option value="a ler">a ler</option>
            <option value="lido">lido</option>
        </select>

        <button type="submit">Adicionar</button>
    </form>

    <a href="{{ url_for('index') }}">&larr; Voltar à lista</a>

    <script>
        async function procurarISBN() {
            const campoIsbn = document.getElementById("isbn");
            const botao = document.getElementById("btn-procurar");
            const mensagem = document.getElementById("mensagem-isbn");
            const capa = document.getElementById("capa-preview");
            const isbn = campoIsbn.value.trim();

            mensagem.textContent = "";
            capa.style.display = "none";

            if (!isbn) {
                mensagem.textContent = "Escreve um ISBN antes de procurar.";
                return;
            }

            // Feedback visual durante a espera síncrona: o pedido ao Flask
            // só volta depois de lookup_isbn() acabar (incluindo retries),
            // por isso o botão fica desativado para não disparar pedidos
            // repetidos enquanto isso corre.
            botao.disabled = true;
            botao.textContent = "A procurar...";

            try {
                const resposta = await fetch(`/pesquisar-isbn?isbn=${encodeURIComponent(isbn)}`);
                const dados = await resposta.json();

                if (!resposta.ok) {
                    mensagem.textContent = dados.erro || "Erro ao procurar.";
                    return;
                }

                // Preenchimento seletivo: só substitui campos que a API trouxe
                // com conteúdo, tal como a GUI faz — nunca apaga o que o
                // utilizador já tinha escrito à mão (ex. coleção, que
                // nenhuma das duas APIs expõe).
                if (dados.titulo) document.getElementById("titulo").value = dados.titulo;
                if (dados.autores_str) document.getElementById("autores_str").value = dados.autores_str;
                if (dados.editora) document.getElementById("editora").value = dados.editora;
                if (dados.genero) document.getElementById("genero").value = dados.genero;

                if (dados.capa_url) {
                    capa.src = dados.capa_url;
                    capa.style.display = "block";
                }

                mensagem.textContent = "Livro encontrado.";
            } catch (erro) {
                mensagem.textContent = "Erro de rede ao contactar o servidor.";
            } finally {
                botao.disabled = false;
                botao.textContent = "Procurar";
            }
        }
    </script>
</body>
</html>
