name: Testes Automáticos

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Preparar pasta de dados
        run: mkdir -p data

      - name: Correr testes automatizados (pytest)
        run: pytest -v

      - name: Smoke test — confirmar que a CLI arranca e sai sem erro
        run: echo '0' | python cli.py
